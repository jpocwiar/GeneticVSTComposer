name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # auval only finds registered components, so the fresh build is copied into the user
      # Components folder of this runner first.
      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/GeneticComposer_artefacts/Release/AU/Genetic Composer.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a > /dev/null
          auval -v aumu Gnc2 Gnco
      - uses: actions/upload-artifact@v4
        with:
          name: GeneticComposer-${{ matrix.os }}
          path: |
            build/GeneticComposer_artefacts/Release/VST3/
            build/GeneticComposer_artefacts/Release/AU/
            build/GeneticComposer_artefacts/Release/Standalone/
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure engine with ASan and UBSan
        run: >
          cmake -S . -B build
          -DCOMPOSER_BUILD_PLUGIN=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
  # The search pool, the search thread, the audio callback and the editor share state through
  # atomics, a spin lock and the document mutex. ThreadSanitizer checks the plugin suites too.
  threads:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ThreadSanitizer
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=thread"
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build tests
        run: cmake --build build --target engine_tests plugin_tests --parallel 4
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure
  pluginval:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Pluginval strictness 5
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --verbose \
            "build/GeneticComposer_artefacts/Release/VST3/Genetic Composer.vst3"
